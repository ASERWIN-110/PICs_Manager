server:
  port: ":8080"
  timeout: 30s
  # 兼容旧版维护 token。新部署建议使用 security 设备绑定。
  maintenanceToken: ""

security:
  # NAS 长期运行建议开启。开启后可用 pics-cli -action create-pairing-code 生成一次性配对码。
  enabled: false
  # 留空时使用 <logger.path>/auth/devices.json。文件里只保存 token 哈希，不保存明文 token。
  storePath: ""
  # 配对码有效期；控制配对码多久可以被领取。
  defaultPairingTTL: "24h"
  # 设备 token 有效期。空字符串或 "0" 表示不过期。
  defaultDeviceTTL: "0"
  # true 表示查看、搜索、缩略图、下载都需要 viewer/maintainer/admin token。
  requireViewerForRead: true
  # true 表示本机请求可无 token 修改完整配置；远程请求即使 admin token 也不能改数据库、日志和关键路径。
  allowLocalAdmin: true
  # 留空时使用本地开发默认值；生产反代可配置固定 origin。
  corsAllowedOrigins: []

scheduler:
  enabled: false
  interval: "6h"
  mode: "full"
  runOnStartup: false

runRetention:
  # 0 表示不按数量清理。
  maxRuns: 200
  # 0 表示不按天数清理。
  maxAgeDays: 90

database:
  uri: "mongodb://localhost:27017"
  name: "media_manager"

logger:
  level: "debug"
  format: "text"
  path: "./logs"
  
scanner:
  # 扫描模式：
  # full: 分类、归档并同步数据库
  # classifyOnly: 只分类和归档，不写入数据库
  mode: "full"

  # =================================================================
  # 重要：请将下面的路径修改为您自己电脑上的实际路径！
  # =================================================================
  # 扫描路径：新文件被发现的入口。
  scanPath: "F:/Test/Test_NewFiles"
  # 中转站路径：程序处理过程中的临时工作区。
  stagingPath: "F:/Test/Test_Staging"
  # 最终库路径：所有文件最终被整理、归档和存放的地方。
  finalLibraryPath: "F:/Test/Test_Library"
  # 备份文件的根目录
  backupPath: "F:/Test/Test_Backups"
  # 隔离区路径
  quarantinePath: "F:/Test/Test_Quarantined"
  # 错误文件日志
  corruptionLogPath: "./corrupted_files.log"
  # 用于存放扫描时发现的、数据库中已存在的重复文件的目录名。
  # 它将被创建在 scanPath 目录下。
  duplicatesDir: "_duplicates"

  # 可选：指定并发worker的数量。
  # 如果设置为 0 或不设置此项，程序将自动使用您电脑的CPU核心数。
  workerCount: 0

  # 数据库批量写入的大小。建议值为 100-500。
  # 设置为 0 或不设置，将使用默认值 100。
  batchSize: 100

  # NAS 长期无人值守建议保持保守。0 表示使用程序默认值（最多 4 个 worker）。
  # 单文件移动前的轻量 IO 节流，单位毫秒。0 表示不节流。
  ioThrottleMs: 0
  # 可选维护时间窗口，格式 HH:MM-HH:MM。留空表示任何时间都可运行。
  maintenanceWindow: ""
  # 目录健康报告阈值。0 表示不报警。
  maxFilesPerDir: 5000
  # 默认跳过 symlink。开启后会解析真实路径，并要求仍在扫描根/最终库内部。
  followSymlinks: false
  
  # --- 用于“文件分类”的严格规则 (从文件名提取系列名) ---
  filePatterns:
    - '^(.*?)_(\d+)_p(\d+)_(\d+)(\.[a-zA-Z0-9_]+)?$'
    - '^(.*?)_(\d+)_p(\d+)(\.[a-zA-Z0-9_]+)?$'
    - '^(.*?)_(\d+)(\.[a-zA-Z0-9_]+)?$'
    - '^(.*?)_pg(\d+)_(\d+)(\.[a-zA-Z0-9_]+)?$'
    - '^(.*?)_(\d+)_p(\d+).(\.[a-zA-Z0-9_]+)?$'

  # --- 按媒体类型分别配置扩展名和分类正则 ---
  # image 会兼容使用上面的 filePatterns；这里显式列出是为了便于后台编辑。
  mediaTypes:
    - type: "image"
      extensions: [".jpg", ".jpeg", ".png", ".gif", ".webp"]
      filePatterns:
        - '^(.*?)_(\d+)_p(\d+)_(\d+)(\.[a-zA-Z0-9_]+)?$'
        - '^(.*?)_(\d+)_p(\d+)(\.[a-zA-Z0-9_]+)?$'
        - '^(.*?)_(\d+)(\.[a-zA-Z0-9_]+)?$'
        - '^(.*?)_pg(\d+)_(\d+)(\.[a-zA-Z0-9_]+)?$'
        - '^(.*?)_(\d+)_p(\d+).(\.[a-zA-Z0-9_]+)?$'
    - type: "video"
      extensions: [".mp4", ".mkv", ".mov", ".avi", ".wmv", ".webm", ".m4v"]
      filePatterns:
        - '^(.*?)_(\d+)(\.[a-zA-Z0-9_]+)?$'
    - type: "audio"
      extensions: [".mp3", ".flac", ".wav", ".aac", ".ogg", ".m4a"]
      filePatterns:
        - '^(.*?)_(\d+)(\.[a-zA-Z0-9_]+)?$'
    - type: "text"
      extensions: [".txt", ".md", ".pdf", ".epub"]
      filePatterns:
        - '^(.*?)_(\d+)(\.[a-zA-Z0-9_]+)?$'

  # --- 用于“目录聚合”的智能规则 (从系列文件夹名提取集合名) ---
  seriesGroupPatterns:
    - name: "前置序号"  # name 字段用于日志，方便调试
      pattern: '^\s*\(\d+\)\s*(?P<group>.*)'
    - name: "括号"
      pattern: '^[『「《[(【（](?P<group>.*?)[』」》)\]】）]'
    - name: "文本+数字"
      pattern: '^(?P<group>.+?)\s*(\d+)$'
